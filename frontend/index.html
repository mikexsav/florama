<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#202125" />
  <title>FLORAMA — мониторинг территорий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=10" />
  <link rel="stylesheet" href="production.css?v=10" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 20 20"><image href="src/control%20panel.svg" width="20" height="20"/></symbol>
    <symbol id="i-field" viewBox="0 0 20 20"><image href="src/polignoes.svg" width="20" height="20"/></symbol>
    <symbol id="i-chart" viewBox="0 0 20 20"><image href="src/analytics.svg" width="20" height="20"/></symbol>
    <symbol id="i-settings" viewBox="0 0 20 20"><image href="src/settings.svg" width="20" height="20"/></symbol>
    <symbol id="i-user" viewBox="0 0 50 50"><image href="src/userprofile.svg" width="50" height="50"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 15.3A8.5 8.5 0 0 1 8.7 3.3 8.5 8.5 0 1 0 20.7 15.3Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><image href="src/uchastok.svg" width="20" height="20"/></symbol>
    <symbol id="i-pin" viewBox="0 0 20 20"><image href="src/location.svg" width="20" height="20"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 23 23"><image href="src/calendar.svg" width="23" height="23"/></symbol>
    <symbol id="i-clock" viewBox="0 0 20 20"><image href="src/time.svg" width="20" height="20"/></symbol>
    <symbol id="i-alert" viewBox="0 0 20 18"><image href="src/warning.svg" width="20" height="18"/></symbol>
    <symbol id="i-layers" viewBox="0 0 19 19"><image href="src/satellite.svg" width="19" height="19"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m5 18 5-5 3.5 3.5 2-2 3.5 3.5"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .9-7.9A6 6 0 0 0 6.1 9 4.5 4.5 0 0 0 7 18Z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.6 5.5 3.6 9S14.5 18.5 12 21c-2.5-2.5-3.6-5.5-3.6-9S9.5 5.5 12 3Z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.2 4L19 6.5"/></symbol>
  </svg>
  <section id="auth-screen" class="auth-screen" aria-labelledby="auth-title">
    <div class="auth-screen__imagery" aria-hidden="true"></div>
    <button class="auth-theme" type="button" aria-label="Переключить тему"><svg><use href="#i-moon"/></svg></button>
    <div class="auth-card">
      <a class="auth-logo" href="#">FLORAMA</a>
      <p class="auth-kicker">Спутниковый мониторинг территорий</p>
      <h1 id="auth-title">Создайте аккаунт</h1>
      <p id="auth-description">Начните отслеживать состояние своих полей и получать данные со спутников.</p>
      <form id="auth-form" class="auth-form" novalidate>
        <div class="auth-form__names"><label>Имя<input name="firstName" autocomplete="given-name" /></label><label>Фамилия<input name="lastName" autocomplete="family-name" /></label></div>
        <label>Почта<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
        <label class="auth-code">Код<button id="send-code" type="button" aria-label="Отправить код на почту">Отправить код</button><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required /></label>
        <p id="auth-notice" class="auth-notice" aria-live="polite"></p>
        <button id="auth-submit" class="button-primary auth-submit" type="submit">Зарегистрироваться</button>
      </form>
      <button id="auth-mode-switch" class="auth-mode-switch" type="button">Уже есть аккаунт</button>
    </div>
  </section>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="logo" href="#dashboard" aria-label="FLORAMA — главная">FLORAMA</a>
      <nav class="main-nav">
        <button class="nav-link is-active" type="button" data-view="dashboard"><img class="nav-icon" src="src/control%20panel.svg" alt="" aria-hidden="true"><span>Панель управления</span></button>
        <button class="nav-link" type="button" data-view="polygons"><img class="nav-icon" src="src/polignoes.svg" alt="" aria-hidden="true"><span>Полигоны</span></button>
        <button class="nav-link" type="button" data-view="analytics"><img class="nav-icon" src="src/analytics.svg" alt="" aria-hidden="true"><span>Аналитика</span></button>
        <button class="nav-link" type="button" data-view="research"><img class="nav-icon" src="src/satellite.svg" alt="" aria-hidden="true"><span>Лаборатория NDVI</span></button>
        <button class="nav-link" type="button" data-view="settings"><img class="nav-icon" src="src/settings.svg" alt="" aria-hidden="true"><span>Настройки</span></button>
      </nav>
      <div class="sidebar-story" aria-hidden="true"><div class="sidebar-story__shade"></div><p>Больше,<br />чем просто снимки</p><span>Реальные данные для устойчивого будущего</span></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="Открыть меню"><span></span><span></span><span></span></button><div class="topbar__spacer"></div>
        <div class="account-wrap"><button class="account-button" type="button" aria-expanded="false" aria-controls="account-menu"><img class="avatar-image" src="src/userprofile.svg" alt="" aria-hidden="true"><span class="account-name">yourmail@gmail.com</span></button><div id="account-menu" class="account-menu" hidden><strong>Михаил Савченко</strong><span>mmmsss717171@gmail.com</span><button type="button" data-view="settings"><img class="menu-icon" src="src/settings.svg" alt="" aria-hidden="true">Настройки профиля</button><button type="button" data-logout><svg><use href="#i-logout"/></svg>Выйти</button></div></div>
        <button class="round-button theme-button" type="button" aria-label="Переключить тему"><svg><use href="#i-moon"/></svg></button>
      </header>
      <section id="screen" class="screen" aria-live="polite"></section>
    </main>
  </div>
  <div class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal__close" type="button" aria-label="Закрыть"><span></span><span></span></button><div id="modal-content"></div></section></div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js?v=10"></script>
</body>
</html>
