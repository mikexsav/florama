services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment: &florama-environment
      FLORAMA_ENV: development
      APP_SECRET: local-development-secret-change-in-production-2026
      APP_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      DEV_OTP_CODE: "000000"
      DB_PATH: /data/florama.sqlite3
      DATA_DIR: /data
    volumes:
      - florama-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "worker.py"]
    environment: *florama-environment
    volumes:
      - florama-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  florama-data:
