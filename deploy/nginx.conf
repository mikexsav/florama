# Подключается внутри http {}. TLS включается только после выпуска действительного сертификата.
server {
    listen 80;
    server_name crewloom.ru www.crewloom.ru api.crewloom.ru;
    root /opt/florama/frontend;
    index index.html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location ~ /\. { deny all; }
    location ~* \.(js|css|html)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
